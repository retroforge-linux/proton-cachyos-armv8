name: Sync

# Builds Proton-CachyOS's newest release for ARMv8.0: the newest published, non-prerelease
# `cachyos-<major>.<minor>-<yyyymmdd>-slr` release of CachyOS/proton-cachyos (by version, then date),
# unless a release <tag>-armv8 exists here already.

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Proton-CachyOS tag to build (empty: its newest release)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=$INPUT_TAG
          if [ -z "$tag" ]; then
            tag=$(gh api --paginate 'repos/CachyOS/proton-cachyos/releases?per_page=100' \
                    --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
                  grep -E '^cachyos-[0-9]+\.[0-9]+-[0-9]{8}-slr$' | sort -V | tail -1)
            if [ -n "$tag" ] && gh release view "$tag-armv8" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              tag=
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: >-
            azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox
            postgresql* temurin-* mysql* dotnet-sdk-*
          remove_packages_one_command: false
          remove_folders: >-
            /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli
            /usr/local/aws-sam-cli /usr/share/gradle
          testing: false

      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y ccache fontforge-nox llvm zstd

      - uses: actions/checkout@v6

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-cachyos-${{ github.run_id }}
          restore-keys: ccache-cachyos-

      - name: Build
        run: CCACHE_DIR="$HOME/.ccache" scripts/build.sh "$TAG" "$RUNNER_TEMP/work"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ccache-cachyos-${{ github.run_id }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/work/proton-$TAG-armv8.tar.zst"
          gh release create "$TAG-armv8" --title "Proton-CachyOS ${TAG#cachyos-} (ARMv8.0)" \
            --notes "Proton-CachyOS's [\`$TAG\`](https://github.com/CachyOS/proton-cachyos/releases/tag/$TAG) arm64 build, for ARMv8.0 CPUs (no LSE atomics): \`-march=armv8-a\`, and no inline LSE/RCpc in its arm64 binaries. Extract into \`compatibilitytools.d\`." \
            "$f" "$f.sha256" "$f.sha512"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Build failed: $TAG"
          gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q . ||
            gh issue create --title "$title" \
              --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. If build.sh's Makefile edits no longer match \`$TAG\`, refresh them."
